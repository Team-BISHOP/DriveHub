# Starts the whole DriveHub system: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432" # lets you run a single service outside Docker while developing
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672" # broker, for running a single service outside Docker
      - "15672:15672" # management UI: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  fleet-service:
    build: ./services/fleet-service
    ports: ["3001:3001"]
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/fleetdb
    volumes:
      - fleet_uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }

  booking-service:
    build: ./services/booking-service
    ports: ["3002:3002"]
    environment:
      PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/bookingdb
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      FLEET_URL: http://fleet-service:3001
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      fleet-service: { condition: service_started }

  payment-service:
    build: ./services/payment-service
    ports: ["3003:3003"]
    environment:
      PORT: 3003
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/paymentdb
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  notification-service:
    build: ./services/notification-service
    ports: ["3004:3004"]
    environment:
      PORT: 3004
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/notificationdb
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  analytics-service:
    build: ./services/analytics-service
    ports: ["3005:3005"]
    environment:
      PORT: 3005
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/analyticsdb
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      FLEET_URL: http://fleet-service:3001
      BOOKING_URL: http://booking-service:3002
      PAYMENT_URL: http://payment-service:3003
      NOTIFY_URL: http://notification-service:3004
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      fleet-service: { condition: service_started }
      booking-service: { condition: service_started }
      payment-service: { condition: service_started }
      notification-service: { condition: service_started }

volumes:
  pgdata:
  fleet_uploads:
